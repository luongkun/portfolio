<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0820"/>
      <stop offset="100%" stop-color="#1f0e3d"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.05" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="rgba(255,94,149,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,94,149,0)"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="rgba(125,86,232,0.45)"/>
      <stop offset="100%" stop-color="rgba(125,86,232,0)"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0" r="0.5">
      <stop offset="0%" stop-color="rgba(199,94,216,0.28)"/>
      <stop offset="100%" stop-color="rgba(199,94,216,0)"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#ff8fb6"/>
      <stop offset="50%" stop-color="#d77fe6"/>
      <stop offset="100%" stop-color="#9c7ff0"/>
    </linearGradient>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7eaa"/>
      <stop offset="55%" stop-color="#c75ed8"/>
      <stop offset="100%" stop-color="#5b3edc"/>
    </linearGradient>
    <linearGradient id="dgShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.1" fill="rgba(255,255,255,0.05)"/>
    </pattern>
    <linearGradient id="pillG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,94,149,0.16)"/>
      <stop offset="100%" stop-color="rgba(125,86,232,0.16)"/>
    </linearGradient>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>
  <rect width="1200" height="630" fill="url(#glowC)"/>

  <!-- Subtle decorative shapes ONLY in safe corners (top-left logo area + bottom-right margin) -->
  <circle cx="60" cy="600" r="3" fill="rgba(255,94,149,0.6)"/>
  <circle cx="100" cy="610" r="2" fill="rgba(199,94,216,0.5)"/>
  <circle cx="1140" cy="40" r="3" fill="rgba(125,86,232,0.5)"/>

  <!-- Top thin gradient line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#dg)"/>

  <!-- ============== TOP ROW: logo + AVAILABLE pill ============== -->

  <!-- Diamond logo + PORTFOLIO label -->
  <g transform="translate(72,68)">
    <path d="M40 0 L80 40 L40 80 L0 40 Z" fill="url(#dg)"/>
    <path d="M40 0 L80 40 L40 80 L0 40 Z" fill="url(#dgShine)"/>
    <path d="M40 0 L80 40 L40 80 L0 40 Z" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.4"/>
    <path d="M30 26 V54 H52" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="172" y="118" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="rgba(255,255,255,0.6)">PORTFOLIO</text>

  <!-- AVAILABLE FOR HIRE pill -->
  <g transform="translate(880,82)">
    <rect x="0" y="0" width="248" height="48" rx="24" fill="url(#pillG)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <circle cx="24" cy="24" r="10" fill="rgba(61,220,151,0.25)"/>
    <circle cx="24" cy="24" r="6" fill="#3ddc97"/>
    <text x="42" y="31" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#e8e8f8">AVAILABLE FOR HIRE</text>
  </g>

  <!-- ============== CENTER LEFT: name + tagline ============== -->

  <text x="72" y="298" font-family="Be Vietnam Pro, Plus Jakarta Sans, system-ui, sans-serif" font-size="138" font-weight="800" fill="#ffffff" letter-spacing="-2">Lương</text>
  <text x="72" y="420" font-family="Be Vietnam Pro, Plus Jakarta Sans, system-ui, sans-serif" font-size="138" font-weight="800" fill="url(#textGrad)" letter-spacing="-2">Senpai.</text>

  <!-- Tagline -->
  <text x="76" y="468" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" font-weight="500" fill="rgba(255,255,255,0.65)">{ turning &quot;ideas&quot; → &quot;products&quot; }</text>

  <!-- ============== BOTTOM ROW: tech pills (auto-sized, no overlap) ============== -->
  <g transform="translate(72,510)" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="14" font-weight="600">
    <!-- Pill 1: Fullstack -->
    <g>
      <rect x="0" y="0" width="142" height="40" rx="20" fill="rgba(255,94,149,0.16)" stroke="rgba(255,94,149,0.42)" stroke-width="1"/>
      <text x="71" y="25" text-anchor="middle" fill="#ffd0e0">Fullstack Developer</text>
    </g>
    <!-- Pill 2: React -->
    <g transform="translate(154,0)">
      <rect x="0" y="0" width="172" height="40" rx="20" fill="rgba(199,94,216,0.16)" stroke="rgba(199,94,216,0.42)" stroke-width="1"/>
      <text x="86" y="25" text-anchor="middle" fill="#f0c8f8">React · Next · TS</text>
    </g>
    <!-- Pill 3: Node -->
    <g transform="translate(338,0)">
      <rect x="0" y="0" width="180" height="40" rx="20" fill="rgba(125,86,232,0.16)" stroke="rgba(125,86,232,0.42)" stroke-width="1"/>
      <text x="90" y="25" text-anchor="middle" fill="#d8c8ff">Node · NestJS · Py</text>
    </g>
    <!-- Pill 4: Vietnam -->
    <g transform="translate(530,0)">
      <rect x="0" y="0" width="128" height="40" rx="20" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
      <text x="64" y="25" text-anchor="middle" fill="rgba(255,255,255,0.85)">📍 Việt Nam</text>
    </g>
  </g>

  <!-- ============== RIGHT SIDE: large diamond logo (separated from text) ============== -->
  <g transform="translate(900,225)">
    <!-- Soft glow halo -->
    <ellipse cx="115" cy="140" rx="135" ry="110" fill="rgba(199,94,216,0.18)"/>
    <!-- Diamond -->
    <path d="M115 0 L230 115 L115 230 L0 115 Z" fill="url(#dg)"/>
    <path d="M115 0 L230 115 L115 230 L0 115 Z" fill="url(#dgShine)"/>
    <path d="M115 0 L230 115 L115 230 L0 115 Z" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="1.6"/>
    <path d="M88 80 V158 H148" fill="none" stroke="#fff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ============== FOOTER URL ============== -->
  <text x="72" y="595" font-family="JetBrains Mono, ui-monospace, monospace" font-size="15" font-weight="500" fill="rgba(255,255,255,0.45)">luongkun.github.io/portfolio</text>
  <text x="1128" y="595" text-anchor="end" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="3" fill="rgba(255,255,255,0.4)">© 2026 LƯƠNG SENPAI</text>
</svg>
