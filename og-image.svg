<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0820"/>
      <stop offset="100%" stop-color="#1f0e3d"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.32" r="0.55">
      <stop offset="0%" stop-color="rgba(255,94,149,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,94,149,0)"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.78" r="0.55">
      <stop offset="0%" stop-color="rgba(125,86,232,0.55)"/>
      <stop offset="100%" stop-color="rgba(125,86,232,0)"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.62" cy="0.18" r="0.45">
      <stop offset="0%" stop-color="rgba(199,94,216,0.4)"/>
      <stop offset="100%" stop-color="rgba(199,94,216,0)"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#ff8fb6"/>
      <stop offset="50%" stop-color="#d77fe6"/>
      <stop offset="100%" stop-color="#9c7ff0"/>
    </linearGradient>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7eaa"/>
      <stop offset="55%" stop-color="#c75ed8"/>
      <stop offset="100%" stop-color="#5b3edc"/>
    </linearGradient>
    <linearGradient id="dgShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.2" fill="rgba(255,255,255,0.06)"/>
    </pattern>
    <linearGradient id="pillG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(255,94,149,0.18)"/>
      <stop offset="100%" stop-color="rgba(125,86,232,0.18)"/>
    </linearGradient>
  </defs>

  <!-- BG layers -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>
  <rect width="1200" height="630" fill="url(#glowC)"/>

  <!-- Floating decorative shapes -->
  <circle cx="1080" cy="120" r="38" fill="rgba(255,255,255,0.07)" stroke="rgba(255,94,149,0.4)" stroke-width="1.5"/>
  <circle cx="80" cy="540" r="58" fill="rgba(255,255,255,0.05)" stroke="rgba(125,86,232,0.4)" stroke-width="1.5"/>
  <rect x="1040" y="450" width="62" height="62" rx="14" fill="rgba(199,94,216,0.12)" stroke="rgba(199,94,216,0.35)" stroke-width="1.5" transform="rotate(18 1071 481)"/>
  <rect x="120" y="120" width="46" height="46" rx="10" fill="rgba(255,94,149,0.1)" stroke="rgba(255,94,149,0.35)" stroke-width="1.5" transform="rotate(-12 143 143)"/>
  <ellipse cx="950" cy="320" rx="14" ry="6" fill="rgba(125,86,232,0.4)" transform="rotate(-25 950 320)"/>

  <!-- Diamond logo top-left -->
  <g transform="translate(80,82)">
    <path d="M44 0 L88 44 L44 88 L0 44 Z" fill="url(#dg)"/>
    <path d="M44 0 L88 44 L44 88 L0 44 Z" fill="url(#dgShine)"/>
    <path d="M44 0 L88 44 L44 88 L0 44 Z" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.4"/>
    <path d="M34 30 V58 H56" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- "PORTFOLIO" small label top -->
  <text x="190" y="138" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="6" fill="rgba(255,255,255,0.55)">PORTFOLIO</text>

  <!-- Status pill top-right -->
  <g transform="translate(900,108)">
    <rect x="0" y="0" width="220" height="44" rx="22" fill="url(#pillG)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <circle cx="22" cy="22" r="6" fill="#3ddc97"/>
    <circle cx="22" cy="22" r="9" fill="rgba(61,220,151,0.25)"/>
    <text x="38" y="29" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#e8e8f8">AVAILABLE FOR HIRE</text>
  </g>

  <!-- Main name -->
  <text x="80" y="335" font-family="Be Vietnam Pro, Plus Jakarta Sans, system-ui, sans-serif" font-size="148" font-weight="800" fill="#ffffff" letter-spacing="-2">Lương</text>
  <text x="80" y="465" font-family="Be Vietnam Pro, Plus Jakarta Sans, system-ui, sans-serif" font-size="148" font-weight="800" fill="url(#textGrad)" letter-spacing="-2">Senpai.</text>

  <!-- Tagline -->
  <text x="80" y="528" font-family="JetBrains Mono, ui-monospace, monospace" font-size="22" font-weight="500" fill="rgba(255,255,255,0.7)">{ turning &quot;ideas&quot; → &quot;products&quot; }</text>

  <!-- Pills row -->
  <g transform="translate(80,560)">
    <g>
      <rect x="0" y="0" width="120" height="38" rx="19" fill="rgba(255,94,149,0.15)" stroke="rgba(255,94,149,0.4)" stroke-width="1"/>
      <text x="60" y="24" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#ffd0e0">Fullstack Dev</text>
    </g>
    <g transform="translate(132,0)">
      <rect x="0" y="0" width="118" height="38" rx="19" fill="rgba(199,94,216,0.15)" stroke="rgba(199,94,216,0.4)" stroke-width="1"/>
      <text x="59" y="24" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#f0c8f8">React · Next · TS</text>
    </g>
    <g transform="translate(262,0)">
      <rect x="0" y="0" width="120" height="38" rx="19" fill="rgba(125,86,232,0.15)" stroke="rgba(125,86,232,0.4)" stroke-width="1"/>
      <text x="60" y="24" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#d8c8ff">Node · NestJS · Py</text>
    </g>
    <g transform="translate(394,0)">
      <rect x="0" y="0" width="98" height="38" rx="19" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
      <text x="49" y="24" font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="rgba(255,255,255,0.85)">📍 Việt Nam</text>
    </g>
  </g>

  <!-- Right-side decorative big diamond -->
  <g transform="translate(880,275)" opacity="0.95">
    <path d="M125 0 L250 125 L125 250 L0 125 Z" fill="url(#dg)" opacity="0.85"/>
    <path d="M125 0 L250 125 L125 250 L0 125 Z" fill="url(#dgShine)"/>
    <path d="M125 0 L250 125 L125 250 L0 125 Z" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.6"/>
    <path d="M95 90 V170 H160" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- glow under -->
  </g>

  <!-- bottom URL -->
  <text x="80" y="608" font-family="JetBrains Mono, ui-monospace, monospace" font-size="16" font-weight="500" fill="rgba(255,255,255,0.45)">luongkun.github.io/portfolio</text>

  <!-- Top thin gradient line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#dg)"/>
</svg>
